<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4CAF79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="浇花打卡">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>浇花打卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="pageTitle">🌿 浇花打卡</div>
      <div class="top-actions">
        <button class="icon-btn" id="btnBackup" title="备份">💾</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active"><span class="ico">🏠</span>首页</button>
      <button data-tab="calendar"><span class="ico">📅</span>日历</button>
      <button data-tab="stats"><span class="ico">📊</span>统计</button>
      <button data-tab="settings"><span class="ico">⚙️</span>设置</button>
    </nav>

    <button class="fab" id="fabAdd" title="添加花草">＋</button>
  </div>

  <!-- 弹层容器 -->
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="store.js"></script>
  <script src="plants.js"></script>
  <script src="app.js"></script>
</body>
</html>
