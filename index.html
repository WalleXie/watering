<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4CAF79">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="浇花打卡">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>浇花打卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="pageTitle">🌿 浇花打卡</div>
      <div class="top-actions">
        <button class="icon-btn" id="btnBackup" title="备份">💾</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active"><span class="ico">🏠</span>首页</button>
      <button data-tab="plants"><span class="ico">🌿</span>花草</button>
      <button data-tab="calendar"><span class="ico">📅</span>日历</button>
      <button data-tab="stats"><span class="ico">📊</span>统计</button>
      <button data-tab="settings"><span class="ico">⚙️</span>设置</button>
    </nav>

    <button class="fab" id="fabAdd" title="添加花草">＋</button>
  </div>

  <!-- 导入用的文件输入框（固定在 DOM 里，iOS Safari 才可靠） -->
  <input type="file" id="importFile" accept="application/json,.json,text/plain" style="display:none" />

  <!-- 弹层容器 -->
  <div id="modalRoot"></div>
  <!-- 底部选择菜单（拍照/相册） -->
  <div id="actionSheet" class="sheet-mask" style="display:none">
    <div class="sheet">
      <div class="sheet-title">选择照片来源</div>
      <button class="sheet-item" id="sheetCamera">📷 拍照</button>
      <button class="sheet-item" id="sheetAlbum">🖼️ 从相册选择</button>
      <button class="sheet-item sheet-cancel" id="sheetCancel">取消</button>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="store.js"></script>
  <script src="plants.js"></script>
  <script src="plantapi.js"></script>
  <script src="ai.js"></script>
  <script src="workbuddy.js"></script>
  <script src="app.js"></script>
</body>
</html>
